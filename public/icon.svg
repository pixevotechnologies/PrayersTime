<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="softEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Base Background Squircle with subtle inset -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Celestial Compass Outer Dial -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.8" />
  
  <!-- Directional Cardinal Indicator (North/Qibla) -->
  <polygon points="256,76 264,96 248,96" fill="url(#goldGrad)" />
  <circle cx="256" cy="424" r="3" fill="#10b981" fill-opacity="0.5" />
  <circle cx="88" cy="256" r="3" fill="#10b981" fill-opacity="0.5" />
  <circle cx="424" cy="256" r="3" fill="#10b981" fill-opacity="0.5" />

  <!-- Modern Crescent Moon - Symbolizing Lunar / Islamic Rhythm & Time -->
  <path d="M 276 132 C 196 132 136 192 136 272 C 136 348 194 404 270 404 C 304 404 336 392 360 372 C 308 376 262 334 262 278 C 262 216 304 168 362 168 C 336 144 308 132 276 132 Z" 
        fill="url(#softEmerald)" fill-opacity="0.25" />

  <!-- Central Kaaba & Direction Isometric Hexagon / Diamond -->
  <g transform="translate(256, 256)">
    <!-- Top Face (Subtle Gold) -->
    <polygon points="0,-48 42,-24 0,0 -42,-24" fill="url(#goldGrad)" />
    <!-- Left Face (Deep Emerald) -->
    <polygon points="-42,-24 0,0 0,52 -42,28" fill="#047857" />
    <!-- Right Face (Mid Emerald) -->
    <polygon points="0,0 42,-24 42,28 0,52" fill="#065f46" />
    <!-- Central Gilded Kiswah Band Accent -->
    <polyline points="-42,-8 0,16 42,-8" fill="none" stroke="#fef08a" stroke-width="3" stroke-opacity="0.9" />
  </g>

  <!-- Central Radiant Star / Sun Ray -->
  <circle cx="256" cy="180" r="4" fill="#fbbf24" />
</svg>
